name: studio_shell
description: Desktop shell of Studio, the visual editor for Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

resolution: workspace

dependencies:
  devtools_app:
  devtools_app_shared:
  file_selector: ^1.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  material_ui: ^1.1.0
  path: ^1.9.0
  studio_core:
  studio_package_assets:
  studio_protocol:

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
