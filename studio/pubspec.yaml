name: _studio
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/studio_core
  - packages/studio_shell
  - packages/studio_tool

dev_dependencies:
  flutter_lints: ^6.0.0

dependency_overrides:
  devtools_app:
    path: ../packages/devtools_app
  devtools_app_shared:
    path: ../packages/devtools_app_shared
  devtools_extensions:
    path: ../packages/devtools_extensions
  devtools_shared:
    path: ../packages/devtools_shared
